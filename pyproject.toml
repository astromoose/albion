[project]
name = "albion"
version = "0.1.0"
description = "Warhammer & tabletop hobby blog aggregator/reader"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "jinja2==3.1.4",
    "sqlalchemy==2.0.36",
    "aiosqlite==0.20.0",
    "httpx==0.28.1",
    "beautifulsoup4==4.12.3",
    "lxml==5.3.0",
    "html2text==2024.2.26",
    "feedparser==6.0.11",
    "apscheduler==3.10.4",
    "python-multipart==0.0.20",
    "markupsafe==3.0.2",
    "markdown==3.7",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "ruff==0.8.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["albion*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
