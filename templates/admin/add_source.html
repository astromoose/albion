{% extends "base.html" %}
{% block title %}Add Source - ALBION{% endblock %}

{% block content %}
<div class="admin-header">
    <h1>Add New Source</h1>
    <a href="/admin" class="btn btn-secondary">&larr; Back</a>
</div>

<form method="post" action="/admin/sources/add" class="form-card">
    <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required placeholder="e.g. Goonhammer">
    </div>

    <div class="form-group">
        <label for="url">Site URL</label>
        <input type="url" id="url" name="url" required placeholder="https://example.com">
    </div>

    <div class="form-group">
        <label for="feed_url">RSS Feed URL <span class="muted">(optional)</span></label>
        <input type="url" id="feed_url" name="feed_url" placeholder="https://example.com/feed/">
        <small class="form-hint">Leave empty for HTML-only scraping. Most WordPress sites have /feed/</small>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label for="scraper_type">Scraper Type</label>
            <select id="scraper_type" name="scraper_type">
                <option value="wordpress">WordPress / Generic RSS</option>
                <option value="warhammer_community">Warhammer Community</option>
            </select>
        </div>

        <div class="form-group">
            <label for="poll_interval">Poll Interval (minutes)</label>
            <input type="number" id="poll_interval" name="poll_interval" value="60" min="5" max="1440">
        </div>
    </div>

    <button type="submit" class="btn btn-primary">Add Source</button>
</form>
{% endblock %}
